[platformio]
default_envs = freenove_fnk0104ab
core_dir = ../../work/platformio

[env:freenove_fnk0104ab]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
board_build.partitions = partitions.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:tools/upload_guard.py
custom_hardware_confirmed = yes
custom_confirmed_variant = FNK0104A
upload_port = COM3
monitor_port = COM3
build_flags =
    -include include/BoardConfig.h
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
